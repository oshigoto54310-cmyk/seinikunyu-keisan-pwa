<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173e36">
    <meta name="description" content="精肉商品の値入率と原価をその場で計算します。">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <title>精肉 値入計算</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">値</div>
        <div>
          <p class="eyebrow">精肉部門</p>
          <h1>値入計算</h1>
        </div>
      </header>

      <section class="result-panel" aria-labelledby="rate-label">
        <div class="result-heading">
          <span id="rate-label" class="result-label">値入率</span>
          <span class="result-tax">税抜</span>
        </div>
        <p id="margin-rate" class="margin-rate" aria-live="polite">—<span>%</span></p>
        <p id="result-message" class="result-message" role="status" aria-live="polite">裸原価と売価を入力すると計算します。</p>
      </section>

      <section class="key-results" aria-label="計算結果">
        <article class="result-card result-card-primary">
          <p class="card-label">値入高</p>
          <p id="margin-amount" class="card-value">—<span>円/kg</span></p>
        </article>
        <article class="result-card">
          <p class="card-label">完成品原価</p>
          <p id="finished-cost" class="card-value">—<span>円/kg</span></p>
        </article>
      </section>

      <section class="detail-results" aria-label="原価の内訳">
        <div class="detail-row">
          <span>本部費加算後</span>
          <strong id="hq-cost">—<small>円/kg</small></strong>
        </div>
        <div class="detail-row">
          <span>歩留後原価</span>
          <strong id="yield-cost">—<small>円/kg</small></strong>
        </div>
        <div class="detail-row">
          <span>消耗品加算後</span>
          <strong id="supplies-cost">—<small>円/kg</small></strong>
        </div>
        <div class="detail-row">
          <span>ロス反映後原価</span>
          <strong id="loss-cost">—<small>円/kg</small></strong>
        </div>
      </section>

      <form id="calculator-form" novalidate>
        <section class="input-section" aria-labelledby="product-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">商品ごとに入力</p>
              <h2 id="product-heading">商品条件</h2>
            </div>
            <button id="clear-product" class="clear-button" type="button">入力クリア</button>
          </div>

          <div class="field-list">
            <label class="field" for="raw-cost">
              <span class="field-copy"><span class="field-label">裸原価</span><span class="field-unit">税抜・円/kg</span></span>
              <input id="raw-cost" name="rawCost" type="text" inputmode="decimal" placeholder="例 1,280" autocomplete="off">
            </label>
            <label class="field" for="selling-price">
              <span class="field-copy"><span class="field-label">売価</span><span class="field-unit">税抜・円/kg</span></span>
              <input id="selling-price" name="sellingPrice" type="text" inputmode="decimal" placeholder="例 1,980" autocomplete="off">
            </label>
            <label class="field" for="yield-rate">
              <span class="field-copy"><span class="field-label">歩留まり</span><span class="field-unit">%</span></span>
              <input id="yield-rate" name="yieldRate" type="text" inputmode="decimal" value="100" autocomplete="off">
            </label>
            <label class="field" for="loss-rate">
              <span class="field-copy"><span class="field-label">ロス率</span><span class="field-unit">%</span></span>
              <input id="loss-rate" name="lossRate" type="text" inputmode="decimal" value="0" autocomplete="off">
            </label>
          </div>
        </section>

        <details id="settings-details" class="settings-section">
          <summary class="section-heading settings-heading">
            <div>
              <p class="eyebrow">端末内に保存</p>
              <h2 id="settings-heading">共通条件</h2>
            </div>
            <span class="settings-summary-meta">
              <span id="settings-preview" class="settings-preview">本部 5%・消耗品 2.5%</span>
              <span class="settings-chevron" aria-hidden="true">⌄</span>
            </span>
          </summary>
          <div class="settings-content">
            <p class="settings-note">共通条件のみ、この端末に保存されます（商品条件は保存されません）</p>
            <p id="save-status" class="save-status">この端末に保存</p>
            <div class="field-list">
              <label class="field" for="hq-rate">
                <span class="field-copy"><span class="field-label">本部費率</span><span class="field-unit">%</span></span>
                <input id="hq-rate" name="hqRate" type="text" inputmode="decimal" value="5" autocomplete="off">
              </label>
              <label class="field" for="supplies-rate">
                <span class="field-copy"><span class="field-label">消耗品比率</span><span class="field-unit">%</span></span>
                <input id="supplies-rate" name="suppliesRate" type="text" inputmode="decimal" value="2.5" autocomplete="off">
              </label>
            </div>
          </div>
        </details>

        <section class="reverse-section" aria-labelledby="reverse-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">目標値入率から</p>
              <h2 id="reverse-heading">逆算</h2>
            </div>
          </div>
          <div class="reverse-card">
            <label class="field" for="target-margin-rate">
              <span class="field-copy"><span class="field-label">目標値入率</span><span class="field-unit">%</span></span>
              <input id="target-margin-rate" name="targetMarginRate" type="text" inputmode="decimal" placeholder="例 25" autocomplete="off">
            </label>
            <p id="reverse-message" class="reverse-message" role="status" aria-live="polite"></p>
            <div class="reverse-results" aria-label="逆算結果">
              <div class="reverse-result">
                <span class="reverse-result-label">必要売価</span>
                <strong id="required-selling-price">—<small>円/kg</small></strong>
                <p id="required-price-reference" class="reverse-reference">100g当たり —円（値入率 —%）</p>
              </div>
              <div class="reverse-result">
                <span class="reverse-result-label">許容裸原価</span>
                <strong id="allowable-raw-cost">—<small>円/kg</small></strong>
              </div>
            </div>
          </div>
        </section>
      </form>

      <footer class="app-footer">計算結果はすべて税抜・円/kgです</footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
